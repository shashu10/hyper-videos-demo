<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="lib/theme.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/animations.js"></script>
  </head>
  <body>
    <!--
      ====================================================================
      Fable 5 · "The new best AI model is here" · 84s · 7 scenes
      Anthropic palette · production spec: .hyperframes/expanded-prompt.md

      Rhythm: PUNCH - build - PEAK(hold) - rapid-fire - TWIST - NERF - resolve

      Voiceover: record per the script and drop at assets/voiceover.mp3,
      then add an audio element inside #root with id "voiceover",
      data-start "0", data-duration "84", data-track-index "0",
      data-volume "1", and src pointing at the file.
      ====================================================================
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="84"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1 · Hook · 0-6s -->
      <div
        id="scene-1"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- Scene 2 · What it is / leaderboard · 6-18s -->
      <div
        id="scene-2"
        data-composition-id="scene-2-leaderboard"
        data-composition-src="compositions/scene-2-leaderboard.html"
        data-start="6"
        data-duration="12"
        data-track-index="1"
      ></div>

      <!-- Scene 3 · Weight class / hero bar chart · 18-36s -->
      <div
        id="scene-3"
        data-composition-id="scene-3-benchmark"
        data-composition-src="compositions/scene-3-benchmark.html"
        data-start="18"
        data-duration="18"
        data-track-index="1"
      ></div>

      <!-- Scene 4 · Proof montage · 36-50s -->
      <div
        id="scene-4"
        data-composition-id="scene-4-proof"
        data-composition-src="compositions/scene-4-proof.html"
        data-start="36"
        data-duration="14"
        data-track-index="1"
      ></div>

      <!-- Scene 5 · Price kicker · 50-64s -->
      <div
        id="scene-5"
        data-composition-id="scene-5-price"
        data-composition-src="compositions/scene-5-price.html"
        data-start="50"
        data-duration="14"
        data-track-index="1"
      ></div>

      <!-- Scene 6 · The Nerf — safeguards + Opus 4.8 fallback · 64-76s -->
      <div
        id="scene-6"
        data-composition-id="scene-6-nerf"
        data-composition-src="compositions/scene-6-nerf.html"
        data-start="64"
        data-duration="12"
        data-track-index="1"
      ></div>

      <!-- Scene 7 · Outro · 76-84s -->
      <div
        id="scene-7"
        data-composition-id="scene-7-outro"
        data-composition-src="compositions/scene-7-outro.html"
        data-start="76"
        data-duration="8"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
