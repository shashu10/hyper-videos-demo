<template id="scene-7-outro-template">
  <div id="scene-7-outro" data-composition-id="scene-7-outro" data-width="1080" data-height="1920" class="scene">
    <!-- ====================================================================
         Scene 6 · Outro · 8s · resolve
         Slate closing card. Final scene — exit fade allowed.
         ==================================================================== -->

    <div id="s7-closing-card" class="seg seg--slate clip" data-start="0" data-duration="8" data-track-index="0" style="gap: 48px;">
      <div class="paper-wash paper-wash--slate"></div>

      <div class="spark" data-anim="o-spark" style="position: relative; width: 150px; height: 150px;">
        <svg viewBox="0 0 100 100" fill="none" data-anim="o-spark-rot">
          <g stroke="#D97757" stroke-width="7" stroke-linecap="round">
            <line x1="50" y1="2" x2="50" y2="28" /><line x1="50" y1="72" x2="50" y2="98" />
            <line x1="2" y1="50" x2="28" y2="50" /><line x1="72" y1="50" x2="98" y2="50" />
            <line x1="16" y1="16" x2="34" y2="34" /><line x1="66" y1="66" x2="84" y2="84" />
            <line x1="16" y1="84" x2="34" y2="66" /><line x1="66" y1="34" x2="84" y2="16" />
          </g>
        </svg>
      </div>

      <h2 class="seg__line" style="font-size: 124px;" data-anim="o-line">The new <span class="accent">SOTA.</span></h2>

      <div data-anim="o-try"
        style="font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-weight: 520; font-size: 60px; letter-spacing: -0.02em; color: #d4a27f;">
        Try it this week.
      </div>

      <div class="chip chip--coral" data-anim="o-chip" style="margin-top: 24px;">Follow for more &rarr;</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const COMP = "scene-7-outro";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });

      window.__hf.popIn(tl, sel('[data-anim="o-spark"]'), 0.25, { fromScale: 0.3, duration: 0.55, ease: "back.out(1.5)" });
      tl.fromTo(sel('[data-anim="o-spark-rot"]'), { rotation: 0 }, { rotation: 70, duration: 7.7, ease: "none" }, 0.3);
      window.__hf.fadeInUp(tl, sel('[data-anim="o-line"]'), 0.6, { y: 56, duration: 0.8, ease: "power3.out" });
      window.__hf.fadeInUp(tl, sel('[data-anim="o-try"]'), 1.25, { y: 36, duration: 0.65, ease: "power2.out" });
      window.__hf.fadeInUp(tl, sel('[data-anim="o-chip"]'), 1.7, { y: 28, duration: 0.55, ease: "expo.out" });

      // Final scene only: fade to slate.
      tl.to(
        [
          sel('[data-anim="o-spark"]'),
          sel('[data-anim="o-line"]'),
          sel('[data-anim="o-try"]'),
          sel('[data-anim="o-chip"]'),
        ],
        { opacity: 0, duration: 0.7, ease: "power2.in" },
        7.2,
      );

      tl.set(ROOT, { opacity: 1 }, 8);
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
