    <!-- ── Segment 1 · 0.0–3.0s · slate punch ───────────────────────────── -->
    <div id="s6-nerfed" class="seg seg--slate clip" data-start="0" data-duration="3" data-track-index="0" style="gap: 40px;">
      <div class="paper-wash paper-wash--slate"></div>
      <div class="seg__kicker" data-anim="n-eyebrow">One more thing</div>
      <h2 class="seg__line" style="font-size: 104px; max-width: 820px;" data-anim="n-line">
        The public version is <span class="accent">nerfed.</span>
      </h2>
      <div class="seg__sub" data-anim="n-sub">It ships with intense safeguards.</div>
    </div>

    <!-- ── Segment 2 · 3.0–9.0s · Claude UI — block + fallback ──────────── -->
    <div id="s6-fallback-demo" class="seg clip" data-start="3" data-duration="6" data-track-index="0" style="gap: 40px;">
      <div class="paper-wash"></div>
      <div class="seg__kicker" data-anim="u-eyebrow">In my own testing</div>

      <div class="claude-ui" data-anim="u-card">
        <div class="claude-ui__header">
          <div class="claude-ui__brand">
            <svg viewBox="0 0 100 100" fill="none" style="width: 40px; height: 40px;">
              <g stroke="#D97757" stroke-width="9" stroke-linecap="round">
                <line x1="50" y1="4" x2="50" y2="30" /><line x1="50" y1="70" x2="50" y2="96" />
                <line x1="4" y1="50" x2="30" y2="50" /><line x1="70" y1="50" x2="96" y2="50" />
                <line x1="18" y1="18" x2="36" y2="36" /><line x1="64" y1="64" x2="82" y2="82" />
                <line x1="18" y1="82" x2="36" y2="64" /><line x1="64" y1="36" x2="82" y2="18" />
              </g>
            </svg>
            Claude
          </div>
          <span data-layout-allow-overlap style="position: relative; display: inline-flex;">
            <span class="model-pill" data-anim="u-pill-header-fable">Fable 5</span>
            <span class="model-pill model-pill--opus" data-anim="u-pill-header-opus"
              style="position: absolute; inset: 0; justify-content: center;">Opus 4.8</span>
          </span>
        </div>

        <div class="claude-ui__body">
          <div class="msg msg--user" data-anim="u-msg-user">Research Fable 5 for me &mdash; what can it do?</div>

          <div class="block-banner" data-anim="u-block">
            <span class="block-banner__icon">!</span>
            <span>Request blocked &mdash; model safeguards triggered</span>
          </div>

          <div class="reroute-row" data-anim="u-reroute">
            <span class="model-pill model-pill--dead">Fable 5
              <span class="model-pill__strike" data-anim="u-strike"></span>
            </span>
            <span class="reroute-row__arrow">&rarr;</span>
            <span class="model-pill model-pill--opus" data-anim="u-pill-opus">Opus 4.8</span>
            <span class="reroute-row__label">quietly rerouted</span>
          </div>

          <div class="msg msg--ai" data-anim="u-msg-ai">
            Here&rsquo;s what I can share about Fable 5&hellip;
            <span class="msg__meta">answered by Claude Opus 4.8</span>
          </div>
        </div>

      <div class="seg__credit" data-anim="u-sub">asked it to research itself &rarr; blocked &rarr; downgraded</div>
    </div>

    <!-- ── Segment 3 · 9.0–12.0s · Mythos is locked away ────────────────── -->
    <div id="s6-mythos" class="seg seg--slate clip" data-start="9" data-duration="3" data-track-index="0" style="gap: 40px;">
      <div class="paper-wash paper-wash--slate"></div>
      <div class="seg__kicker" data-anim="m-eyebrow">The unlocked version?</div>
      <h2 class="seg__line" style="font-size: 110px; max-width: 820px;" data-anim="m-line">
        Mythos 5 &mdash; <span class="accent">restricted.</span>
      </h2>
      <div class="seg__sub" data-anim="m-sub">cyberdefenders + infrastructure providers only</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const COMP = "scene-6-nerf";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });

      // ── seg1 · nerfed punch ───────────────────────────────────────────
      window.__hf.fadeInDown(tl, sel('[data-anim="n-eyebrow"]'), 0.15, { y: -22, duration: 0.4, ease: "power2.out" });
      window.__hf.slamIn(tl, sel('[data-anim="n-line"]'), 0.3, { fromScale: 1.45, duration: 0.34, ease: "power4.out" });
      window.__hf.fadeInUp(tl, sel('[data-anim="n-sub"]'), 0.85, { y: 28, duration: 0.5, ease: "power3.out" });

      // ── seg2 · Claude UI demo ─────────────────────────────────────────
      window.__hf.fadeInDown(tl, sel('[data-anim="u-eyebrow"]'), 3.1, { y: -22, duration: 0.45, ease: "power2.out" });
      window.__hf.maskReveal(tl, sel('[data-anim="u-card"]'), 3.25, { fromScale: 0.93, duration: 0.65, ease: "expo.out" });
      window.__hf.fadeInRight(tl, sel('[data-anim="u-msg-user"]'), 3.8, { x: 60, duration: 0.5, ease: "power3.out" });
      // the block hits
      window.__hf.slamIn(tl, sel('[data-anim="u-block"]'), 4.7, { fromScale: 1.18, duration: 0.3, ease: "power4.out" });
      // header pill dies, reroute appears: strike sweeps, Opus pill pops
      window.__hf.fadeIn(tl, sel('[data-anim="u-reroute"]'), 5.4, { duration: 0.4, ease: "power1.out" });
      window.__hf.ruleDraw(tl, sel('[data-anim="u-strike"]'), 5.7, { duration: 0.3, ease: "power4.out" });
      window.__hf.popIn(tl, sel('[data-anim="u-pill-opus"]'), 6.0, { fromScale: 0.6, duration: 0.45, ease: "back.out(1.5)" });
      // header pill swaps Fable 5 → Opus 4.8 in place
      gsap.set(sel('[data-anim="u-pill-header-opus"]'), { opacity: 0 });
      tl.fromTo(
        sel('[data-anim="u-pill-header-opus"]'),
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.inOut" },
        6.0,
      );
      // the quiet answer
      window.__hf.fadeInUp(tl, sel('[data-anim="u-msg-ai"]'), 6.6, { y: 30, duration: 0.55, ease: "power3.out" });
      window.__hf.fadeIn(tl, sel('[data-anim="u-sub"]'), 7.3, { duration: 0.5, ease: "power1.out" });

      // ── seg3 · Mythos restricted ──────────────────────────────────────
      window.__hf.fadeInDown(tl, sel('[data-anim="m-eyebrow"]'), 9.1, { y: -22, duration: 0.45, ease: "power2.out" });
      window.__hf.zoomInBig(tl, sel('[data-anim="m-line"]'), 9.25, { fromScale: 0.5, duration: 0.55, ease: "expo.out" });
      window.__hf.fadeInUp(tl, sel('[data-anim="m-sub"]'), 9.8, { y: 26, duration: 0.5, ease: "power2.out" });

      tl.set(ROOT, { opacity: 1 }, 12);
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
