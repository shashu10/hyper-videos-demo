<template id="scene-5-price-template">
  <div id="scene-5-price" data-composition-id="scene-5-price" data-width="1080" data-height="1920" class="scene">
    <!-- ====================================================================
         Scene 5 · The kicker · 14s · TWIST
         seg1 (book cloth): "The catch?"
         seg2 (ivory): price stack — Fable glowing on top
         seg3 (ivory-deep): "the best model has never been the cheap one."
         ==================================================================== -->
    <style>
      #scene-5-price .price-stack {
        display: flex;
        flex-direction: column;
        gap: 22px;
        width: 820px;
      }
      #scene-5-price .price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 38px;
        border-radius: 16px;
        background: #faf9f5;
        border: 1px solid rgba(20, 20, 19, 0.14);
        box-shadow: 0 12px 40px rgba(20, 20, 19, 0.08);
      }
      #scene-5-price .price-row__name {
        font-family: "Archivo", system-ui, sans-serif;
        font-weight: 700;
        font-size: 40px;
        color: #141413;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      #scene-5-price .price-row__val {
        font-family: "Space Mono", ui-monospace, monospace;
        font-weight: 700;
        font-size: 40px;
        color: #5e5d59;
        font-variant-numeric: tabular-nums;
      }
      #scene-5-price .price-row--fable {
        background: #d97757;
        border-color: #d97757;
        padding: 38px 38px;
        box-shadow: 0 0 80px rgba(217, 119, 87, 0.35);
      }
      #scene-5-price .price-row--fable .price-row__name {
        font-size: 48px;
        color: #141413;
      }
      #scene-5-price .price-row--fable .price-row__val {
        font-size: 48px;
        color: #141413;
      }
      #scene-5-price .price-row__crown {
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: 24px;
        letter-spacing: 0.16em;
        padding: 6px 14px;
        border-radius: 8px;
        background: #141413;
        color: #faf9f5;
      }
      #scene-5-price .approx { font-size: 30px; }
    </style>

    <!-- ── Segment 1 · 0.0–2.5s · the catch ─────────────────────────────── -->
    <div id="s5-the-catch" class="seg seg--book clip" data-start="0" data-duration="2.5" data-track-index="0" style="gap: 36px;">
      <h2 class="seg__line seg__line--xl" data-anim="k-line" style="max-width: 820px;">The catch?</h2>
      <div class="seg__sub" data-anim="k-sub" style="font-weight: 600;">
        It&rsquo;s the most expensive model on the market.
      </div>
    </div>

    <!-- ── Segment 2 · 2.5–10.0s · price stack ──────────────────────────── -->
    <div id="s5-price-stack" class="seg clip" data-start="2.5" data-duration="7.5" data-track-index="0" style="gap: 52px;">
      <div class="paper-wash"></div>
      <div class="seg__kicker" data-anim="pr-eyebrow">Price per 1M tokens &middot; in / out</div>

      <div class="price-stack">
        <div class="price-row price-row--fable" data-anim="pr-fable">
          <span class="price-row__name">Fable 5 <span class="price-row__crown">TOP</span></span>
          <span class="price-row__val">$10 / $50</span>
        </div>
        <div class="price-row pr-rest" data-anim="pr-opus">
          <span class="price-row__name">Opus 4.8</span>
          <span class="price-row__val">$5 / $25</span>
        </div>
        <div class="price-row pr-rest" data-anim="pr-gemini">
          <span class="price-row__name">Gemini 3 Pro</span>
          <span class="price-row__val"><span class="approx">~</span>$2 / $12</span>
        </div>
        <div class="price-row pr-rest" data-anim="pr-gpt">
          <span class="price-row__name">GPT-5.5</span>
          <span class="price-row__val"><span class="approx">~</span>$1.75 / $14</span>
        </div>
      </div>

      <div class="seg__sub" data-anim="pr-sub" style="max-width: 720px;">
        Slower, token-hungry &mdash; built for the big, meaty problems. Hand it one and let it run.
      </div>
    </div>

    <!-- ── Segment 3 · 10.0–14.0s · confident close of the twist ────────── -->
    <div id="s5-never-cheap" class="seg seg--deep clip" data-start="10" data-duration="4" data-track-index="0" style="gap: 44px;">
      <div class="paper-wash"></div>
      <h2 class="seg__line" style="font-size: 92px; max-width: 820px;" data-anim="ch-line">
        The best model has never been the <span class="accent">cheap one.</span>
      </h2>
      <div class="seg__sub" data-anim="ch-sub" style="font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-weight: 520; font-size: 52px; color: #c15f3c;">
        People pay anyway.
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const COMP = "scene-5-price";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });

      // ── seg1 · the catch ──────────────────────────────────────────────
      window.__hf.slamIn(tl, sel('[data-anim="k-line"]'), 0.15, { fromScale: 1.5, duration: 0.34, ease: "power4.out" });
      window.__hf.fadeInUp(tl, sel('[data-anim="k-sub"]'), 0.55, { y: 30, duration: 0.55, ease: "power3.out" });

      // ── seg2 · price stack ────────────────────────────────────────────
      window.__hf.fadeInDown(tl, sel('[data-anim="pr-eyebrow"]'), 2.65, { y: -22, duration: 0.45, ease: "power2.out" });
      // Fable drops in first, heavy
      window.__hf.fadeInDown(tl, sel('[data-anim="pr-fable"]'), 2.85, { y: -90, duration: 0.6, ease: "power4.out" });
      // the rest cascade up beneath it
      window.__hf.staggerInUp(tl, sel(".pr-rest"), 3.25, { y: 44, duration: 0.5, ease: "power3.out", stagger: 0.12 });
      window.__hf.fadeIn(tl, sel('[data-anim="pr-sub"]'), 4.4, { duration: 0.6, ease: "power1.out" });
      // Fable card breathes through the hold (box-shadow only — no transform conflict)
      tl.to(
        sel('[data-anim="pr-fable"]'),
        { boxShadow: "0 0 120px rgba(217, 119, 87, 0.55)", duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 },
        4.6,
      );

      // ── seg3 · confident close ────────────────────────────────────────
      window.__hf.fadeInUp(tl, sel('[data-anim="ch-line"]'), 10.2, { y: 46, duration: 0.85, ease: "power2.out" });
      window.__hf.fadeIn(tl, sel('[data-anim="ch-sub"]'), 11.1, { duration: 0.7, ease: "power1.out" });

      tl.set(ROOT, { opacity: 1 }, 14);
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
