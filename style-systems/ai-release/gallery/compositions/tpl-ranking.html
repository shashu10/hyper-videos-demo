<template id="tpl-ranking-template">
  <div id="tpl-ranking" data-composition-id="tpl-ranking" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="kicker" data-anim="kicker">Open source</div>
      <h2 class="display display--md" data-anim="title">Top Models</h2>
      <div class="rank-list">
        <div class="rank-item bento" data-anim="rank">
          <div class="rank-item__pos rank-item__pos--one" data-anim="pos1">#1</div>
          <div class="rank-item__flag">🇨🇳</div>
          <div class="rank-item__name">DeepSeek V3</div>
        </div>
        <div class="rank-item bento" data-anim="rank">
          <div class="rank-item__pos">#2</div>
          <div class="rank-item__flag">🇺🇸</div>
          <div class="rank-item__name">Llama 4</div>
        </div>
        <div class="rank-item bento" data-anim="rank">
          <div class="rank-item__pos">#3</div>
          <div class="rank-item__flag">🇫🇷</div>
          <div class="rank-item__name">Mistral Large</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-ranking";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.kickerStamp(tl, sel('[data-anim="kicker"]'), 0.15);
      hf.riseIn(tl, sel('[data-anim="title"]'), 0.35);
      hf.tileSnap(tl, sel('[data-anim="rank"]'), 0.7, { stagger: 0.12 });
      hf.lockIn(tl, sel('[data-anim="pos1"]'), 1.25);
      tl.set(ROOT, { opacity: 1 }, 5);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
