<template id="tpl-export-template">
  <div id="tpl-export" data-composition-id="tpl-export" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="kicker kicker--alert" data-anim="kicker">Export control</div>
      <h2 class="display display--md" data-anim="title">Chip Flow</h2>
      <div class="flow" style="position: relative; margin-top: 40px;" data-layout-allow-occlusion>
        <div class="flow__node bento" data-anim="from">H100 class</div>
        <div class="flow__arrow" data-anim="arrow"></div>
        <div class="flow__node bento" data-anim="to">Destination</div>
        <div class="stamp" data-anim="stamp" data-layout-allow-occlusion>BANNED</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-export";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.kickerStamp(tl, sel('[data-anim="kicker"]'), 0.15);
      hf.riseIn(tl, sel('[data-anim="title"]'), 0.35);
      hf.tileSnap(tl, sel('[data-anim="from"]'), 0.6);
      hf.tileSnap(tl, sel('[data-anim="to"]'), 0.75);
      hf.riseIn(tl, sel('[data-anim="arrow"]'), 0.7, { y: 0, duration: 0.4 });
      hf.stamp(tl, sel('[data-anim="stamp"]'), 1.1);
      tl.call(() => document.querySelector(sel('[data-anim="arrow"]')).classList.add("flow__arrow--alert"), null, 1.2);
      tl.set(ROOT, { opacity: 1 }, 5);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
