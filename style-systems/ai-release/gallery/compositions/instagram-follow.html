  <body>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("card");
      var btn = document.getElementById("follow-btn");
      var textFollow = document.getElementById("btn-follow");
      var textFollowing = document.getElementById("btn-following");

      gsap.set(card, { y: 300, opacity: 0 });
      gsap.set(btn, { backgroundColor: "#e8e8e8" });

      tl.to(card, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.to(btn, { scale: 0.92, duration: 0.15, ease: "power2.out" }, 1.0);
      tl.to(btn, { scale: 1, duration: 0.35, ease: "power2.out" }, 1.15);
      tl.to(btn, { backgroundColor: "#ff0000", duration: 0.12, ease: "none" }, 1.15);
      tl.to(textFollow, { opacity: 0, duration: 0.08, ease: "none" }, 1.15);
      tl.to(textFollowing, { opacity: 1, duration: 0.08, ease: "none" }, 1.18);
      tl.to(card, { y: 300, opacity: 0, duration: 0.25, ease: "power3.in" }, 3.8);

      tl.set('[data-composition-id="instagram-follow"]', { opacity: 1 }, 4.5);
      window.__timelines["instagram-follow"] = tl;
