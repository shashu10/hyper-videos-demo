<template id="tpl-quote-template">
  <div id="tpl-quote" data-composition-id="tpl-quote" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="stamp stamp--win l-stamp-inline" data-anim="stamp">CONFIRMED</div>
      <div class="quote-card bento" data-anim="card">
        <p class="quote-card__text">
          <span class="quote-highlight" data-anim="highlight">
            Open weights will catch closed models within 18 months.
          </span>
        </p>
        <div class="quote-card__attr">— sourced prediction · illustrative</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-quote";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.stamp(tl, sel('[data-anim="stamp"]'), 0.15);
      hf.riseIn(tl, sel('[data-anim="card"]'), 0.45);
      hf.highlightSweep(tl, sel('[data-anim="highlight"]'), 0.7, { height: "8px" });
      tl.set(ROOT, { opacity: 1 }, 4);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
