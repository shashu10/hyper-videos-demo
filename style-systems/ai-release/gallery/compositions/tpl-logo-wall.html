<template id="tpl-logo-wall-template">
  <div id="tpl-logo-wall" data-composition-id="tpl-logo-wall" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="kicker" data-anim="kicker">Landscape</div>
      <h2 class="display display--md" data-anim="title">Who Sits Where</h2>
      <p class="label" data-anim="sub">Bento grid · tile-snap stagger · one entity per tile</p>
      <div class="logo-wall">
        <div class="logo-tile bento" data-anim="tile">OpenAI</div>
        <div class="logo-tile bento" data-anim="tile">Anthropic</div>
        <div class="logo-tile bento" data-anim="tile">Google</div>
        <div class="logo-tile bento" data-anim="tile">Meta</div>
        <div class="logo-tile bento" data-anim="tile">DeepSeek</div>
        <div class="logo-tile bento" data-anim="tile">Mistral</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-logo-wall";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.kickerStamp(tl, sel('[data-anim="kicker"]'), 0.15);
      hf.riseIn(tl, sel('[data-anim="title"]'), 0.35);
      hf.riseIn(tl, sel('[data-anim="sub"]'), 0.55, { y: 18 });
      hf.tileSnap(tl, sel('[data-anim="tile"]'), 0.85, { stagger: 0.06 });
      tl.set(ROOT, { opacity: 1 }, 7);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
