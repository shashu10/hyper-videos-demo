<template id="tpl-benchmark-template">
  <div id="tpl-benchmark" data-composition-id="tpl-benchmark" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="kicker kicker--win" data-anim="kicker">Benchmark</div>
      <h2 class="display display--md" data-anim="title">SWE-bench</h2>
      <p class="label" data-anim="sub">One metric. Plain-English translation underneath.</p>
      <div class="bars">
        <div class="bar-row">
          <div class="bar-row__name">Model C</div>
          <div class="bar-row__track"><div class="bar-row__fill bar-row__fill--e3" data-anim="bar-3" style="width: 58%"></div></div>
          <div class="bar-row__val">58</div>
        </div>
        <div class="bar-row">
          <div class="bar-row__name">Model B</div>
          <div class="bar-row__track"><div class="bar-row__fill bar-row__fill--e1" data-anim="bar-2" style="width: 71%"></div></div>
          <div class="bar-row__val">71</div>
        </div>
        <div class="bar-row">
          <div class="bar-row__name">Model A</div>
          <div class="bar-row__track"><div class="bar-row__fill bar-row__fill--win" data-anim="bar-1" style="width: 84%"></div></div>
          <div class="bar-row__val">84</div>
        </div>
      </div>
      <p class="label label--sm" data-anim="foot">Winner bar is green — always means yes / success.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-benchmark";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.kickerStamp(tl, sel('[data-anim="kicker"]'), 0.15);
      hf.maskWipe(tl, sel('[data-anim="title"]'), 0.3);
      hf.riseIn(tl, sel('[data-anim="sub"]'), 0.5, { y: 20 });
      hf.barGrow(tl, sel('[data-anim="bar-3"]'), 0.8);
      hf.barGrow(tl, sel('[data-anim="bar-2"]'), 0.95);
      hf.barGrow(tl, sel('[data-anim="bar-1"]'), 1.15);
      hf.riseIn(tl, sel('[data-anim="foot"]'), 1.8, { y: 16 });
      tl.set(ROOT, { opacity: 1 }, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
