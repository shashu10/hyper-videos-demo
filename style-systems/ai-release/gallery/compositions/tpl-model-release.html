<template id="tpl-model-release-template">
  <div id="tpl-model-release" data-composition-id="tpl-model-release" data-width="1080" data-height="1920" class="scene">
    <div class="seg">
      <div class="bg"></div>
      <div class="kicker" data-anim="kicker">Model release</div>
      <h2 class="display display--md" data-anim="name">Helix 2</h2>
      <p class="label" data-anim="lab">Acme Labs · builder translation in one line</p>
      <div class="spec-strip">
        <div class="spec-chip bento" data-anim="spec">
          <div class="spec-chip__label">Context</div>
          <div class="spec-chip__value mono" data-anim="ctx">0K</div>
        </div>
        <div class="spec-chip bento" data-anim="spec">
          <div class="spec-chip__label">Price</div>
          <div class="spec-chip__value mono" data-anim="price">$0.00</div>
        </div>
        <div class="spec-chip bento" data-anim="spec">
          <div class="spec-chip__label">Modality</div>
          <div class="spec-chip__value spec-chip__value--text">Text + Vision</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../lib/animations.js"></script>
    <script>
      const COMP = "tpl-model-release";
      const ROOT = `[data-composition-id="${COMP}"]`;
      const sel = (s) => `${ROOT} ${s}`;
      const tl = gsap.timeline({ paused: true });
      const hf = window.__hf;
      hf.kickerStamp(tl, sel('[data-anim="kicker"]'), 0.15);
      hf.riseIn(tl, sel('[data-anim="name"]'), 0.35);
      hf.riseIn(tl, sel('[data-anim="lab"]'), 0.55, { y: 20 });
      hf.tileSnap(tl, sel('[data-anim="spec"]'), 0.8);
      hf.countUp(tl, sel('[data-anim="ctx"]'), 1.1, 400, { suffix: "K", duration: 0.8 });
      hf.countUp(tl, sel('[data-anim="price"]'), 1.35, 0.5, { prefix: "$", decimals: 2, duration: 0.8 });
      tl.set(ROOT, { opacity: 1 }, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines[COMP] = tl;
    </script>
  </div>
</template>
